# Guarded PiperX tool-frame preflight derived from the official AgileX
# PikaAnyArm model and the working Lerobot-Real PiperX implementation.
#
# Important frame convention:
#   E (native J6 -> gripper centre) = Ry(-90 deg) @ Tx(190 mm)
#   C = inverse(E) = [-190, 0, 0, 0, 90, 0]
# The already verified local Pika gesture mapping remains unchanged. C is only
# applied afterwards to turn the desired gripper-centre pose back into the
# native J6 EndPoseCtrl target. Follower tcp_offset_mm must remain zero/omitted.
#
# This file does not replace dual_pika_piper.yaml or any single-arm config.
# Grippers are deliberately disabled for the first wrist/J5/J6 validation.
robot:
  type: uf::dual_piper
  id: dual_piper_piperx_preflight
  parallel_connect: true
  parallel_observation: true
  parallel_action: false
  robots:
    left:
      type: uf::piper
      id: left_piper
      port: can_left
      control_space: cartesian
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      send_cartesian_pose: true
      max_cartesian_step_mm: 2.0
      max_rotation_step_rad: 0.012
      max_cartesian_following_error_mm: 80.0
      max_rotation_following_error_rad: 0.50
      direct_max_step_mm: 2.0
      direct_max_step_rad: 0.012
      translation_deadband_mm: 2.0
      rotation_deadband_rad: 0.006
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 15
      send_gripper: false
      cameras: {}
    right:
      type: uf::piper
      id: right_piper
      port: can_right
      control_space: cartesian
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      send_cartesian_pose: true
      max_cartesian_step_mm: 2.0
      max_rotation_step_rad: 0.012
      max_cartesian_following_error_mm: 80.0
      max_rotation_following_error_rad: 0.50
      direct_max_step_mm: 2.0
      direct_max_step_rad: 0.012
      translation_deadband_mm: 2.0
      rotation_deadband_rad: 0.006
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 15
      send_gripper: false
      cameras: {}

teleop:
  type: uf::dual_pika_teleop
  id: dual_pika_piperx_preflight
  parallel_read: true
  teleops:
    left:
      type: uf::piper_pika_teleop
      id: left_pika
      port: /dev/pika_left
      frequency: 50
      use_gripper: false
      scale_xyz: 0.10
      tracker_device_id: LHR-818D4A5D
      # Preserve the gesture transform already verified on both arms.
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, 150, 250, 180, 0, 0]
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: false
      rotation_style: calibrated_tool
      # Full PiperX physical tool transform, applied after gesture mapping.
      piper_tool_center_to_j6: [-190, 0, 0, 0, 90, 0]
      pose_adaptive_rotation: false
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.25
      rotation_filter_alpha: 0.40
    right:
      type: uf::piper_pika_teleop
      id: right_pika
      port: /dev/pika_right
      frequency: 50
      use_gripper: false
      scale_xyz: 0.10
      tracker_device_id: LHR-52C31F65
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, -150, 250, 180, 0, 0]
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: false
      rotation_style: calibrated_tool
      piper_tool_center_to_j6: [-190, 0, 0, 0, 90, 0]
      pose_adaptive_rotation: false
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.25
      rotation_filter_alpha: 0.40

fps: 50

dataset:
  root: /home/star/lerobot_data/dual_pika_piper_piperx_preflight
  repo_id: local/dual_pika_piper_piperx_preflight
  single_task: Guarded dual Pika to dual PiperX full tool-frame preflight
  fps: 50
  episode_time_s: 15
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
