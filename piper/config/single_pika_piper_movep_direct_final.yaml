# Pika -> Piper movep_direct_final (first final): MOVE P direct + single-cycle caps.
# Direct mode (full target) plus a LARGE per-cycle cap (25 mm / 0.35 rad)
# so fast gestures cannot stall the firmware MOVE P replanner with giant
# single-cycle jumps. Slow/medium motion behaves exactly like V16 direct.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false
  hold_position_on_disconnect: true
  feedback_startup_timeout_s: 5.0

  cartesian_command_mode: direct
  max_cartesian_step_mm: 6.0
  max_rotation_step_rad: 0.10
  max_cartesian_following_error_mm: 600.0
  max_rotation_following_error_rad: 3.2
  # Senior-style full-target direct (no per-cycle caps); MOVE P replans each
  # cycle at the configured speed. Re-enable caps only if the firmware stalls.
  direct_max_step_mm: null
  direct_max_step_rad: null
  translation_deadband_mm: 0.5
  rotation_deadband_rad: 0.004
  workspace_x: [50.0, 600.0]
  workspace_y: [-500.0, 500.0]
  workspace_z: [50.0, 600.0]
  move_mode: move_p
  move_speed_percent: 50
  startup_tcp_pose: [214.476, 3.501, 263.671, -146.447, -7.5, -91.716]
  startup_move_timeout_s: 30

  send_gripper: true
  gripper_effort: 1000
  gripper_ctrl_code: 3
  gripper_command_deadband: 0.005
  gripper_min_command_interval_s: 0.03
  gripper_keepalive_s: 0.20
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_piper_movep_direct_final
  port: /dev/ttyUSB0
  frequency: 100
  use_gripper: true
  scale_xyz: 1.0
  # Senior tool frame: tracker mounted at the gripper center (E^-1 in the
  # senior Lerobot-Real convention, 190 mm along the tool axis).
  tracker_to_robot_eef: [-190, 0, 0, 0, 90, 0]
  # Must match startup_tcp_pose so the rotation pipeline is skew-free and the
  # calibrated rotation mapping matrix stays valid at the actual pose.
  robot_base_pose: [214.476, 3.501, 263.671, -146.447, -7.5, -91.716]
  tracker_device_id: T20

  use_raw_translation_mapping: true

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  # senior = full Lerobot-Real robot_base control target: world-delta rotation
  # conjugated by Q, and the 190 mm gripper-center control point, so the wrist
  # pitches naturally instead of lifting the elbow.
  rotation_style: senior
  tracker_world_to_robot_base_rpy: [-1.976682, -8.57558, 26.502898]
  # Re-derived 2026-08-07 for the startup pose: raw X (Pika roll) -> gripper
  # approach axis, raw Y (pitch down) -> base +Y, raw Z (yaw) -> base +Z.
  # Flip a column's sign in this YAML if a direction feels inverted.
  rotation_mapping_matrix: [
    [0.000000000, 0.991000235, -0.130526192],
    [0.000000000, 0.047154810, 0.547979619],
    [-1.000000000, 0.125279522, 0.826245272],
  ]
  rotation_dominant_axis: false
  rotation_scale: 1.0
  rotation_filter_alpha: 0.4

  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 3
  gripper_filter_alpha: 0.75
  gripper_deadband: 0.005
  gripper_max_step: 0.15

fps: 50

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_movep_direct_final
  repo_id: local/single_pika_piper_movep_direct_final
  single_task: Pika to Piper MOVE P direct teleoperation (final v1)
  fps: 50
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
