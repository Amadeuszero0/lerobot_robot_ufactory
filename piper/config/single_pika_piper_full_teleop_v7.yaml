# Pika -> Piper full teleoperation V7.
# Based on final_v2_gripper: restores 1:1 wrist rotation amplitude while
# keeping the verified MOVE P / 30 Hz translation envelope and the direct
# official-gripper mapping. Does not modify final_v2_gripper or earlier
# profiles.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  # Translation envelope unchanged from final_v2_gripper (verified smooth).
  # Rotation was the blocked channel: step cap raised from 0.012 to 0.03 rad
  # per cycle (~57 deg/s at 30 Hz) and speed raised 10 -> 15 percent so the
  # wrist joints keep a share of the trajectory budget during translation.
  max_cartesian_step_mm: 5.0
  max_rotation_step_rad: 0.03
  translation_deadband_mm: 0.0
  rotation_deadband_rad: 0.003
  workspace_x: [110.0, 230.0]
  workspace_y: [-20.0, 110.0]
  workspace_z: [260.0, 360.0]
  move_mode: move_p
  move_speed_percent: 15
  min_command_interval_s: 0.02
  lock_orientation: false

  send_gripper: true
  gripper_effort: 1000
  gripper_ctrl_code: 3
  gripper_command_deadband: 0.005
  gripper_min_command_interval_s: 0.03
  gripper_keepalive_s: 0.20
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_piper_full_teleop_v7
  port: /dev/ttyUSB50
  frequency: 100
  use_gripper: true
  scale_xyz: 0.30
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: false
  # 1:1 wrist amplitude. Set rotation_filter_alpha back to 1.0 to disable
  # the mild rotation low-pass if wrist lag reappears.
  rotation_scale: 1.0
  rotation_filter_alpha: 0.7

  # Direct physical-opening mapping for the official Piper gripper.
  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 3
  gripper_filter_alpha: 0.75
  gripper_deadband: 0.005
  gripper_max_step: 0.15

fps: 30

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_full_teleop_v7
  repo_id: local/single_pika_piper_full_teleop_v7
  single_task: Pika to Piper full teleoperation V7 wrist amplitude restore
  fps: 30
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
