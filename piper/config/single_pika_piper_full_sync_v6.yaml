# Safety-reverted V6: V5 MOVE P motion plus corrected direct gripper mapping.
# The earlier MOVE L streaming experiment was rejected after physical testing.
# Starting pose verified near XYZ [153.7, 45.3, 310.1] mm.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  max_cartesian_step_mm: 3.0
  max_rotation_step_rad: 0.005
  translation_deadband_mm: 1.5
  rotation_deadband_rad: 0.003

  workspace_x: [110.0, 230.0]
  workspace_y: [-20.0, 110.0]
  workspace_z: [260.0, 360.0]

  # Do not stream MOVE L endpoints: physical testing showed stronger jitter
  # and one unexpected lift. Keep the previously verified MOVE P envelope.
  move_mode: move_p
  move_speed_percent: 5
  min_command_interval_s: 0.10
  lock_orientation: false

  send_gripper: true
  gripper_effort: 1000
  gripper_command_deadband: 0.005
  gripper_min_command_interval_s: 0.03
  gripper_keepalive_s: 0.25
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_full_sync_v6
  port: /dev/ttyUSB50
  frequency: 20
  use_gripper: true
  scale_xyz: 0.35
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: true
  rotation_scale: 0.40

  # Direct Pika opening distance: measured usable range was 0.4-98.1 mm.
  # One-sample median and a fast low-pass remove the stacked V5 latency.
  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 1
  gripper_filter_alpha: 0.80
  gripper_deadband: 0.003
  gripper_max_step: 0.25

fps: 30

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_full_sync_v6
  repo_id: local/single_pika_piper_full_sync_v6
  single_task: safe MOVE P Pika teleoperation with corrected gripper mapping
  fps: 30
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
