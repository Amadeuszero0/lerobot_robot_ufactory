# 双 Pika 控双 Piper：2026-08-11 左右手独立实测平移映射测试版。
#
# 只相对当前稳定 dual_pika_piper.yaml 改动两项：
#   1. 左右 Pika 分别使用本机当前 Lighthouse 布局实测的 raw_translation_matrix；
#   2. scale_xyz 从 0.35 提高到 0.50。
#
# MOVE_P、55% 固件速度、旋转映射、工作空间、夹爪和退出保持行为均保持不变。
# 当前稳定配置不会被覆盖，出现方向异常时立即 Ctrl+C 并切回原配置。
robot:
  type: uf::dual_piper
  id: dual_piper_measured_translation
  parallel_connect: true
  parallel_observation: true
  parallel_action: false
  robots:
    left:
      type: uf::piper
      id: left_piper
      port: can_left
      control_space: cartesian
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      send_cartesian_pose: true
      max_cartesian_step_mm: 10.0
      max_rotation_step_rad: 0.080
      max_cartesian_following_error_mm: 300.0
      max_rotation_following_error_rad: 2.0
      direct_max_step_mm: 15.0
      direct_max_step_rad: 0.18
      translation_deadband_mm: 5.0
      rotation_deadband_rad: 0.020
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 55
      send_gripper: true
      gripper_effort: 1000
      gripper_ctrl_code: 3
      gripper_command_deadband: 0.0
      gripper_min_command_interval_s: 0.03
      gripper_keepalive_s: 0.03
      cameras: {}
    right:
      type: uf::piper
      id: right_piper
      port: can_right
      control_space: cartesian
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      send_cartesian_pose: true
      max_cartesian_step_mm: 10.0
      max_rotation_step_rad: 0.080
      max_cartesian_following_error_mm: 300.0
      max_rotation_following_error_rad: 2.0
      direct_max_step_mm: 15.0
      direct_max_step_rad: 0.18
      translation_deadband_mm: 5.0
      rotation_deadband_rad: 0.020
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 55
      send_gripper: true
      gripper_effort: 1000
      gripper_ctrl_code: 3
      gripper_command_deadband: 0.0
      gripper_min_command_interval_s: 0.03
      gripper_keepalive_s: 0.03
      cameras: {}

teleop:
  type: uf::dual_pika_teleop
  id: dual_pika_measured_translation
  parallel_read: true
  teleops:
    left:
      type: uf::piper_pika_teleop
      id: left_pika
      port: /dev/pika_left
      frequency: 100
      use_gripper: true
      scale_xyz: 0.50
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, 150, 250, 180, 0, 0]
      tracker_device_id: LHR-818D4A5D
      use_raw_translation_mapping: true
      raw_translation_matrix: [
        [0.749125989, -0.659224359, -0.065065328],
        [0.659294133, 0.751519460, -0.023446675],
        [0.064354479, -0.025332676, 0.997605511],
      ]
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: true
      rotation_style: calibrated
      pose_adaptive_rotation: true
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.60
      rotation_filter_alpha: 0.40
      gripper_use_direct_distance: true
      gripper_distance_min_mm: 0.4
      gripper_distance_max_mm: 98.1
      gripper_filter_window: 3
      gripper_filter_alpha: 0.75
      gripper_deadband: 0.005
      gripper_max_step: 0.15
    right:
      type: uf::piper_pika_teleop
      id: right_pika
      port: /dev/pika_right
      frequency: 100
      use_gripper: true
      scale_xyz: 0.50
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, -150, 250, 180, 0, 0]
      tracker_device_id: LHR-52C31F65
      use_raw_translation_mapping: true
      raw_translation_matrix: [
        [0.742152364, -0.660548128, 0.113516691],
        [0.636965134, 0.747823089, 0.187179183],
        [-0.208531262, -0.066609299, 0.975744800],
      ]
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: true
      rotation_style: calibrated
      pose_adaptive_rotation: true
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.60
      rotation_filter_alpha: 0.40
      gripper_use_direct_distance: true
      gripper_distance_min_mm: 0.4
      gripper_distance_max_mm: 98.1
      gripper_filter_window: 3
      gripper_filter_alpha: 0.75
      gripper_deadband: 0.005
      gripper_max_step: 0.15

fps: 100

dataset:
  root: /home/star/lerobot_data/dual_pika_piper_measured_translation
  repo_id: local/dual_pika_piper_measured_translation
  single_task: 双 Pika 实测平移映射控制双 Piper
  fps: 50
  episode_time_s: 30
  reset_time_s: 20
  num_episodes: 50
  push_to_hub: false
