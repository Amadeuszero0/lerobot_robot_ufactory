# Pika -> Piper full teleoperation V12 (50 Hz).
# User feedback: V11 removed most jitter but latency remains; the Piper X
# control loop appears to run at 50 Hz. V12 aligns the command cadence:
#  - fps 30 -> 50, min_command_interval stays 0.02 s (exactly 50 Hz);
#  - per-cycle steps scaled down to keep the same commanded velocity
#    (6 -> 3.6 mm, 0.10 -> 0.06 rad per cycle);
#  - move_speed 15 -> 20 % so the arm tracks the faster command stream;
#  - deadbands scaled (1.0 -> 0.5 mm, 0.006 -> 0.004 rad) so they do not add
#    proportionally more lag at 50 Hz;
#  - rotation_filter_alpha kept at 0.4: at 50 Hz its time constant drops
#    from ~50 ms to ~30 ms, reducing wrist lag.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  workspace_x: [100.0, 600.0]
  workspace_y: [-500.0, 500.0]
  workspace_z: [50.0, 600.0]
  max_cartesian_step_mm: 3.6
  max_rotation_step_rad: 0.06
  translation_deadband_mm: 0.5
  rotation_deadband_rad: 0.004
  move_mode: move_p
  move_speed_percent: 20
  min_command_interval_s: 0.02
  lock_orientation: false

  send_gripper: true
  gripper_effort: 1000
  gripper_ctrl_code: 3
  gripper_command_deadband: 0.005
  gripper_min_command_interval_s: 0.03
  gripper_keepalive_s: 0.20
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_piper_full_teleop_v12
  port: /dev/ttyUSB50
  frequency: 100
  use_gripper: true
  scale_xyz: 0.80
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  use_raw_translation_mapping: true

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: false
  rotation_scale: 0.75
  rotation_filter_alpha: 0.4

  # Direct physical-opening mapping for the official Piper gripper.
  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 3
  gripper_filter_alpha: 0.75
  gripper_deadband: 0.005
  gripper_max_step: 0.15

fps: 50

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_full_teleop_v12
  repo_id: local/single_pika_piper_full_teleop_v12
  single_task: Pika to Piper full teleoperation V12 50Hz
  fps: 50
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
