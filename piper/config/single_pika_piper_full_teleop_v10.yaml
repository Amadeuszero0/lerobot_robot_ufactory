# Pika -> Piper full teleoperation V10.
# Uses the translation mapping measured on 2026-08-05 with
# piper/tools/measure_pika_piper_mapping.py: raw tracker (lighthouse world)
# deltas are mapped directly to the Piper base frame (forward -> +X,
# right -> -Y, up -> +Z), verified within ~1 deg. Rotation keeps the V9
# calibrated mapping (measured pass-through: pitch -> -RX, yaw -> +RY,
# roll -> +RZ at 0.75 gain).
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  workspace_x: [100.0, 600.0]
  workspace_y: [-500.0, 500.0]
  workspace_z: [50.0, 600.0]
  max_cartesian_step_mm: 6.0
  max_rotation_step_rad: 0.10
  translation_deadband_mm: 0.0
  rotation_deadband_rad: 0.0
  move_mode: move_p
  move_speed_percent: 15
  min_command_interval_s: 0.02
  lock_orientation: false

  send_gripper: true
  gripper_effort: 1000
  gripper_ctrl_code: 3
  gripper_command_deadband: 0.005
  gripper_min_command_interval_s: 0.03
  gripper_keepalive_s: 0.20
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_piper_full_teleop_v10
  port: /dev/ttyUSB50
  frequency: 100
  use_gripper: true
  scale_xyz: 0.80
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  # NEW: use the measured raw-delta translation mapping (V10 core fix).
  use_raw_translation_mapping: true

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: false
  rotation_scale: 0.75
  rotation_filter_alpha: 0.6

  # Direct physical-opening mapping for the official Piper gripper.
  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 3
  gripper_filter_alpha: 0.75
  gripper_deadband: 0.005
  gripper_max_step: 0.15

fps: 30

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_full_teleop_v10
  repo_id: local/single_pika_piper_full_teleop_v10
  single_task: Pika to Piper full teleoperation V10 measured translation mapping
  fps: 30
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
