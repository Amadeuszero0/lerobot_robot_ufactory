# 双 Pika + 双 PiPER-X：左腕连续性修复 V2，只读预览。
#
# 安全保证：两侧均 dry_run=true、enable_torque_on_connect=false、
# send_gripper=false；只读取 CAN/Pika 并计算目标，不发送任何运动、模式或夹爪命令。
#
# 相对旧 J5 预览，本版本：
#   1. 左侧使用最近正交反射矩阵，去除三点拟合产生的剪切；
#   2. 左右都启用与实机候选相同的“旋转时冻结 XYZ”门控；
#   3. dry-run IK 从上一帧有效目标连续求解，并拒绝大于 8 度的解支跳变；
#   4. 输出 Pika 映射链、目标 XYZ/轴角、J5 近零和 branch jump 诊断。
robot:
  type: uf::dual_piper_joint_stream
  id: dual_piper_x_j5_left_fix_preview_v2
  parallel_connect: true
  parallel_observation: true
  parallel_action: false
  robots:
    left:
      type: uf::piper_joint_stream
      id: left_piper_x_j5_left_fix_preview_v2
      port: can_left
      kinematic_model: piper_x
      tool_xyz_mm: [0.0, 0.0, 0.0]
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: false
      disable_torque_on_disconnect: false
      dry_run: true
      dry_run_log_interval_s: 0.20
      dry_run_max_branch_jump_deg: 8.0
      dry_run_j5_singularity_deg: 3.0
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      max_cartesian_step_mm: 15.0
      max_rotation_step_rad: 0.18
      translation_deadband_mm: 5.0
      rotation_deadband_rad: 0.020
      max_joint_step_deg: 3.0
      ik_max_iter: 40
      ik_damping: 0.01
      ik_weight_ori: 1.0
      ik_residual_limit: 0.02
      send_gripper: false
      cameras: {}
    right:
      type: uf::piper_joint_stream
      id: right_piper_x_j5_left_fix_preview_v2
      port: can_right
      kinematic_model: piper_x
      tool_xyz_mm: [0.0, 0.0, 0.0]
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: false
      disable_torque_on_disconnect: false
      dry_run: true
      dry_run_log_interval_s: 0.20
      dry_run_max_branch_jump_deg: 8.0
      dry_run_j5_singularity_deg: 3.0
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      max_cartesian_step_mm: 15.0
      max_rotation_step_rad: 0.18
      translation_deadband_mm: 5.0
      rotation_deadband_rad: 0.020
      max_joint_step_deg: 3.0
      ik_max_iter: 40
      ik_damping: 0.01
      ik_weight_ori: 1.0
      ik_residual_limit: 0.02
      send_gripper: false
      cameras: {}

teleop:
  type: uf::dual_pika_teleop
  id: dual_pika_piper_x_j5_left_fix_preview_v2
  parallel_read: true
  teleops:
    left:
      type: uf::piper_pika_teleop
      id: left_pika
      port: /dev/pika_left
      frequency: 100
      use_gripper: false
      scale_xyz: 0.50
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, 150, 250, 180, 0, 0]
      tracker_device_id: LHR-818D4A5D
      use_raw_translation_mapping: true
      raw_translation_matrix: [
        [0.749125989, -0.659224359, -0.065065328],
        [0.659294133, 0.751519460, -0.023446675],
        [0.064354479, -0.025332676, 0.997605511],
      ]
      freeze_translation_while_rotating: true
      translation_rotation_lock_speed_rad_s: 0.12
      translation_rotation_release_speed_rad_s: 0.04
      translation_rotation_release_delay_s: 0.15
      translation_rotation_speed_window_s: 0.08
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: false
      rotation_style: calibrated
      pose_adaptive_rotation: false
      # 最近正交反射矩阵（SVD polar factor）。与旧左矩阵相比不再剪切
      # 旋转向量；三个实测手势到 -X/+Y/+Z 的误差分别约 4.7/9.9/10.4 度。
      rotation_mapping_matrix: [
        [0.554845461, 0.829130049, 0.068482670],
        [0.074991940, -0.131824225, 0.988432386],
        [-0.828566668, 0.543291575, 0.135320144],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.60
      rotation_filter_alpha: 0.40
      rotation_debug: true
      rotation_debug_interval_s: 0.20
    right:
      type: uf::piper_pika_teleop
      id: right_pika
      port: /dev/pika_right
      frequency: 100
      use_gripper: false
      scale_xyz: 0.50
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, -150, 250, 180, 0, 0]
      tracker_device_id: LHR-52C31F65
      use_raw_translation_mapping: true
      raw_translation_matrix: [
        [0.742152364, -0.660548128, 0.113516691],
        [0.636965134, 0.747823089, 0.187179183],
        [-0.208531262, -0.066609299, 0.975744800],
      ]
      freeze_translation_while_rotating: true
      translation_rotation_lock_speed_rad_s: 0.12
      translation_rotation_release_speed_rad_s: 0.04
      translation_rotation_release_delay_s: 0.15
      translation_rotation_speed_window_s: 0.08
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: false
      rotation_style: calibrated
      pose_adaptive_rotation: false
      # 右侧保持已验证矩阵，作为 V2 对照组。
      rotation_mapping_matrix: [
        [0.649663921, 0.755396203, 0.116804594],
        [0.030784953, -0.168024729, 0.991014662],
        [-0.816011179, 0.592811786, 0.017701152],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.60
      rotation_filter_alpha: 0.40
      rotation_debug: true
      rotation_debug_interval_s: 0.20

fps: 100

dataset:
  root: /home/star/lerobot_data/dual_pika_piper_x_j5_left_fix_preview_v2
  repo_id: local/dual_pika_piper_x_j5_left_fix_preview_v2
  single_task: 双 Pika 控制双 PiPER-X，左腕连续性修复 V2 只读预览
  fps: 50
  episode_time_s: 30
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
