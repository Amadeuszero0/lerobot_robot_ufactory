# Pika -> Piper full teleoperation V9.
# Addresses "moving forward makes the gripper rise" and residual jitter.
# Findings from the official PikaAnyArm code and the peer project:
#  - The peer runs rotation gain at 0.5; the official ROS path composes the
#    Pika delta on the CURRENT arm pose. A 1.0 gain on our cross-coupled
#    calibrated mapping turns the natural hand pitch during a forward reach
#    into an explicit lift command.
#  - 30 Hz is kept (do NOT raise): with MOVE P each EndPoseCtrl re-plans, so
#    more frequency means more interrupts. Official smoothness comes from
#    joint-space streaming at 200 Hz, not from a higher Cartesian rate.
# V9 therefore reduces rotation coupling (0.75 gain + mild 0.6 low-pass) and
# keeps the V8 wide workspace / 0.8 translation scale unchanged.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  workspace_x: [100.0, 600.0]
  workspace_y: [-500.0, 500.0]
  workspace_z: [50.0, 600.0]
  max_cartesian_step_mm: 6.0
  max_rotation_step_rad: 0.10
  translation_deadband_mm: 0.0
  rotation_deadband_rad: 0.0
  move_mode: move_p
  move_speed_percent: 15
  min_command_interval_s: 0.02
  lock_orientation: false

  send_gripper: true
  gripper_effort: 1000
  gripper_ctrl_code: 3
  gripper_command_deadband: 0.005
  gripper_min_command_interval_s: 0.03
  gripper_keepalive_s: 0.20
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_piper_full_teleop_v9
  port: /dev/ttyUSB50
  frequency: 100
  use_gripper: true
  scale_xyz: 0.80
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: false
  # 1.0 -> 0.75: reduces the natural-hand-pitch coupling that lifts the
  # gripper during forward reaches (peer runs 0.5; 0.75 was the gain verified
  # for direction). Low-pass 0.6 smooths tracker noise on the wrist channel.
  rotation_scale: 0.75
  rotation_filter_alpha: 0.6

  # Direct physical-opening mapping for the official Piper gripper.
  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 3
  gripper_filter_alpha: 0.75
  gripper_deadband: 0.005
  gripper_max_step: 0.15

fps: 30

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_full_teleop_v9
  repo_id: local/single_pika_piper_full_teleop_v9
  single_task: Pika to Piper full teleoperation V9 anti-lift profile
  fps: 30
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
