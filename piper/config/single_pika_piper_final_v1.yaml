# Final guarded Pika -> Piper pose teleoperation profile.
# Translation timing is inherited from the verified peer-smooth test.
# Calibrated wrist rotation is enabled; the offline Piper gripper is disabled.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  max_cartesian_step_mm: 3.0
  max_rotation_step_rad: 0.008
  translation_deadband_mm: 0.0
  rotation_deadband_rad: 0.002
  workspace_x: [110.0, 230.0]
  workspace_y: [-20.0, 110.0]
  workspace_z: [260.0, 360.0]
  move_mode: move_p
  move_speed_percent: 5
  min_command_interval_s: 0.02
  lock_orientation: false

  # Hardware feedback is currently 2A8=all-zero with driver disabled.
  # Keep this false until the official gripper hardware link is repaired.
  send_gripper: false
  gripper_effort: 1000
  gripper_ctrl_code: 3
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_piper_final_v1
  port: /dev/ttyUSB50
  frequency: 100
  use_gripper: false
  scale_xyz: 0.20
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  # Preserve combined wrist gestures instead of snapping to one axis.
  rotation_dominant_axis: false
  rotation_scale: 0.60

fps: 30

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_final_v1
  repo_id: local/single_pika_piper_final_v1
  single_task: Final smooth Pika pose teleoperation test
  fps: 30
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
