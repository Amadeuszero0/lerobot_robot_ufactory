# Guarded dual-arm TCP pivot preflight. Cartesian xyz now refers to the
# official gripper centre, 145 mm along the local J6 Z axis. Translation is
# strongly suppressed and grippers are disabled for the first hardware test.
robot:
  type: uf::dual_piper
  id: dual_piper_tcp_preflight
  parallel_connect: true
  parallel_observation: true
  parallel_action: false
  robots:
    left:
      type: uf::piper
      id: left_piper
      port: can_left
      control_space: cartesian
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      tcp_offset_mm: [0.0, 0.0, 145.0]
      max_cartesian_step_mm: 1.0
      max_rotation_step_rad: 0.008
      max_cartesian_following_error_mm: 40.0
      max_rotation_following_error_rad: 0.30
      direct_max_step_mm: 1.0
      direct_max_step_rad: 0.008
      translation_deadband_mm: 5.0
      rotation_deadband_rad: 0.008
      lock_orientation: false
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 10
      send_gripper: false
      cameras: {}
    right:
      type: uf::piper
      id: right_piper
      port: can_right
      control_space: cartesian
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      tcp_offset_mm: [0.0, 0.0, 145.0]
      max_cartesian_step_mm: 1.0
      max_rotation_step_rad: 0.008
      max_cartesian_following_error_mm: 40.0
      max_rotation_following_error_rad: 0.30
      direct_max_step_mm: 1.0
      direct_max_step_rad: 0.008
      translation_deadband_mm: 5.0
      rotation_deadband_rad: 0.008
      lock_orientation: false
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 10
      send_gripper: false
      cameras: {}

teleop:
  type: uf::dual_pika_teleop
  id: dual_pika_tcp_preflight
  parallel_read: true
  teleops:
    left:
      type: uf::piper_pika_teleop
      id: left_pika
      port: /dev/pika_left
      frequency: 50
      use_gripper: false
      scale_xyz: 0.01
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, 150, 250, 180, 0, 0]
      tracker_device_id: LHR-818D4A5D
      use_raw_translation_mapping: true
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: false
      rotation_style: calibrated
      pose_adaptive_rotation: false
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.20
      rotation_filter_alpha: 0.50
    right:
      type: uf::piper_pika_teleop
      id: right_pika
      port: /dev/pika_right
      frequency: 50
      use_gripper: false
      scale_xyz: 0.01
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, -150, 250, 180, 0, 0]
      tracker_device_id: LHR-52C31F65
      use_raw_translation_mapping: true
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: false
      rotation_style: calibrated
      pose_adaptive_rotation: false
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.20
      rotation_filter_alpha: 0.50

fps: 50

dataset:
  root: /home/star/lerobot_data/dual_pika_piper_tcp_preflight
  repo_id: local/dual_pika_piper_tcp_preflight
  single_task: Guarded dual Pika to dual Piper gripper-centre TCP preflight
  fps: 50
  episode_time_s: 15
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
