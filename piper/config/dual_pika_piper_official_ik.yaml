# 师兄 Lerobot-Real 方案：双 Pika -> 双 PiPER-X 官方工具坐标 + 官方 URDF IK。
# 该配置与 V7 的 MOVE_P 控制链完全独立，只在选择本文件时加载 Pinocchio/CasADi。
fps: 50

robot:
  type: uf::dual_piper
  id: dual_piper_official_ik
  parallel_connect: true
  parallel_observation: true
  parallel_action: true
  robots:
    left:
      type: uf::piper
      id: left_piper_official_ik
      port: can_left
      control_space: cartesian
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: official_ik
      ik_urdf_path: /home/star/piper_runtime/agx_arm_description/agx_arm_urdf/piper_x/urdf/piper_x_description.urdf
      ik_package_dir: /home/star/piper_runtime
      max_cartesian_step_mm: 6.0
      max_rotation_step_rad: 0.025
      max_cartesian_following_error_mm: 150.0
      max_rotation_following_error_rad: 0.5
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 40
      send_gripper: true
      gripper_effort: 1000
      gripper_ctrl_code: 1
      cameras: {}
    right:
      type: uf::piper
      id: right_piper_official_ik
      port: can_right
      control_space: cartesian
      configure_role_on_connect: false
      piper_init_on_connect: false
      enable_torque_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: official_ik
      ik_urdf_path: /home/star/piper_runtime/agx_arm_description/agx_arm_urdf/piper_x/urdf/piper_x_description.urdf
      ik_package_dir: /home/star/piper_runtime
      max_cartesian_step_mm: 6.0
      max_rotation_step_rad: 0.025
      max_cartesian_following_error_mm: 150.0
      max_rotation_following_error_rad: 0.5
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 40
      send_gripper: true
      gripper_effort: 1000
      gripper_ctrl_code: 1
      cameras: {}

teleop:
  type: uf::dual_pika_teleop
  id: dual_pika_official_ik
  parallel_read: true
  teleops:
    left:
      type: uf::piper_pika_teleop
      id: left_pika_official
      port: /dev/pika_left
      tracker_device_id: LHR-818D4A5D
      frequency: 50
      use_gripper: true
      scale_xyz: 1.0
      tracker_to_robot_eef: [-190, 0, 0, -90, 0, -90]
      robot_base_pose: [157.157, -2.686, 286.813, -124.111, -4.526, -87.919]
      use_raw_translation_mapping: false
      use_calibrated_rotation_mapping: true
      rotation_style: official
      rotation_scale: 1.0
      rotation_filter_alpha: 1.0
      gripper_use_direct_distance: true
      gripper_distance_min_mm: 0.4
      gripper_distance_max_mm: 98.1
      gripper_filter_window: 3
      gripper_filter_alpha: 0.75
      gripper_deadband: 0.005
      gripper_max_step: 0.15
    right:
      type: uf::piper_pika_teleop
      id: right_pika_official
      port: /dev/pika_right
      tracker_device_id: LHR-52C31F65
      frequency: 50
      use_gripper: true
      scale_xyz: 1.0
      tracker_to_robot_eef: [-190, 0, 0, -90, 0, -90]
      robot_base_pose: [161.640, 1.509, 284.606, -116.318, -3.253, -86.640]
      use_raw_translation_mapping: false
      use_calibrated_rotation_mapping: true
      rotation_style: official
      rotation_scale: 1.0
      rotation_filter_alpha: 1.0
      gripper_use_direct_distance: true
      gripper_distance_min_mm: 0.4
      gripper_distance_max_mm: 98.1
      gripper_filter_window: 3
      gripper_filter_alpha: 0.75
      gripper_deadband: 0.005
      gripper_max_step: 0.15

dataset:
  root: /home/star/lerobot_data/dual_pika_piper_official_ik
  repo_id: local/dual_pika_piper_official_ik
  single_task: 师兄版双 Pika 遥操作双 PiPER-X
  fps: 30
  episode_time_s: 30
  reset_time_s: 20
  num_episodes: 50
  push_to_hub: false
