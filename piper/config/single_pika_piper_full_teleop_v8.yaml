# Pika -> Piper full teleoperation V8.
# Learned from the peer project (lerobot_robot_ufactory-other): its smooth,
# low-reach-capable behavior comes from a wide workspace (Z down to 50 mm),
# a near-1:1 translation scale (0.8), a generous rotation step, and an
# ungated clean send loop. We adopt those, but keep OUR calibrated rotation
# mapping (J5/J6 correct) instead of the peer's rotation_axis_map hack,
# whose J5/J6 mapping is wrong.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  # Workspace matched to the peer project's verified box. This is what was
  # blocking low reach: our previous Z lower bound of 260 mm clamped every
  # target below it, so the arm could not bend down. Firmware joint limits
  # still bound the physical arm. First run must be slow and collision-free.
  workspace_x: [100.0, 600.0]
  workspace_y: [-500.0, 500.0]
  workspace_z: [50.0, 600.0]
  max_cartesian_step_mm: 6.0
  max_rotation_step_rad: 0.10
  translation_deadband_mm: 0.0
  rotation_deadband_rad: 0.0
  move_mode: move_p
  move_speed_percent: 15
  min_command_interval_s: 0.02
  lock_orientation: false

  send_gripper: true
  gripper_effort: 1000
  gripper_ctrl_code: 3
  gripper_command_deadband: 0.005
  gripper_min_command_interval_s: 0.03
  gripper_keepalive_s: 0.20
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_piper_full_teleop_v8
  port: /dev/ttyUSB50
  frequency: 100
  use_gripper: true
  # 0.30 -> 0.80 (peer project value): restores most of the hand motion so a
  # low-forward object can actually be reached without exaggerated gestures.
  scale_xyz: 0.80
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  # Keep our calibrated rotation mapping (correct J5/J6 axes). The peer's
  # rotation_axis_map [1,2,0] / signs [-1,-1,1] is NOT adopted.
  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: false
  rotation_scale: 1.0
  # Low-pass disabled: the peer path has none and reports no jitter.
  rotation_filter_alpha: 1.0

  # Direct physical-opening mapping for the official Piper gripper.
  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 3
  gripper_filter_alpha: 0.75
  gripper_deadband: 0.005
  gripper_max_step: 0.15

fps: 30

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_full_teleop_v8
  repo_id: local/single_pika_piper_full_teleop_v8
  single_task: Pika to Piper full teleoperation V8 low-reach profile
  fps: 30
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
