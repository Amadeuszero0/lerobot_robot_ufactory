robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false
  max_cartesian_step_mm: 1.0
  max_rotation_step_rad: 0.0002
  translation_deadband_mm: 1.5
  rotation_deadband_rad: 0.01
  workspace_x:
  - 50
  - 600
  workspace_y:
  - -500
  - 500
  workspace_z:
  - 50
  - 600
  move_mode: move_p
  move_speed_percent: 5
  gripper_effort: 1000
  send_gripper: false
  min_command_interval_s: 0.1
  cameras: {}
teleop:
  type: uf::pika_teleop
  id: pika_single
  port: /dev/ttyUSB50
  frequency: 20
  use_gripper: false
  scale_xyz: 0.5
  tracker_to_robot_eef:
  - 0
  - 0
  - 0
  - 180
  - -90
  - 0
  robot_base_pose:
  - 300
  - 0
  - 250
  - 180
  - 0
  - 0
dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_test01
  repo_id: local/single_pika_piper
  single_task: single pika teleoperates one piper
  fps: 30
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
