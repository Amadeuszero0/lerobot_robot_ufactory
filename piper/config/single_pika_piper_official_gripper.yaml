# Single Pika -> Piper with the original official Piper gripper.
#
# The follower gripper uses the official Piper LeRobot command convention:
# raw opening 0..68000, effort 1000, control code 0x03.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  # Keep the guarded Gemini MOVE P envelope. The 0.04 s gate is deliberately
  # below the 15 Hz loop period so a pose command is not skipped every other tick.
  max_cartesian_step_mm: 5.0
  max_rotation_step_rad: 0.006
  translation_deadband_mm: 1.5
  rotation_deadband_rad: 0.003
  workspace_x: [110.0, 230.0]
  workspace_y: [-20.0, 110.0]
  workspace_z: [260.0, 360.0]
  move_mode: move_p
  move_speed_percent: 8
  min_command_interval_s: 0.04
  lock_orientation: false

  # Official Piper gripper: 0x03 is the convention used by the standalone
  # lerobot_robot_piper adapter (enable and clear gripper error state).
  send_gripper: true
  gripper_effort: 1000
  gripper_ctrl_code: 3
  gripper_command_deadband: 0.01
  gripper_min_command_interval_s: 0.05
  gripper_keepalive_s: 0.30
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_official_piper_gripper
  port: /dev/ttyUSB50
  frequency: 15
  use_gripper: true
  scale_xyz: 0.20
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: true
  rotation_scale: 0.40

  # Pika remains the master input. Its measured 0.4..98.1 mm opening is
  # normalized to the official Piper gripper's 0..68000 raw opening range.
  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 3
  gripper_filter_alpha: 0.60
  gripper_deadband: 0.005
  gripper_max_step: 0.15

fps: 15

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_official_gripper
  repo_id: local/single_pika_piper_official_gripper
  single_task: Pika teleoperation with the official original Piper gripper
  fps: 15
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
