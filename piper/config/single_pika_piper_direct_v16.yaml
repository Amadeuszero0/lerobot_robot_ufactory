# Pika -> Piper V16: direct MOVE P mode (ported from the senior lerobot_real
# fork). Keeps our verified Pika mapping, but the follower sends the FULL
# Cartesian target each cycle (no per-cycle step staircase) with
# following-error guards, exactly like the senior profile that demos well.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false
  hold_position_on_disconnect: true
  feedback_startup_timeout_s: 5.0

  # Direct mode: send the true target; step limits only apply while moving to
  # the startup TCP pose. Guards bound how far the target may jump.
  cartesian_command_mode: direct
  max_cartesian_step_mm: 6.0
  max_rotation_step_rad: 0.10
  max_cartesian_following_error_mm: 600.0
  max_rotation_following_error_rad: 3.2
  translation_deadband_mm: 0.5
  rotation_deadband_rad: 0.004
  workspace_x: [50.0, 600.0]
  workspace_y: [-500.0, 500.0]
  workspace_z: [50.0, 600.0]
  move_mode: move_p
  move_speed_percent: 30
  # Safe startup pose (measured 2026-08-05 from SDK feedback). Remove or
  # change if you prefer to place the arm manually.
  startup_tcp_pose: [214.476, 3.501, 263.671, -146.447, -7.5, -91.716]
  startup_move_timeout_s: 30

  send_gripper: true
  gripper_effort: 1000
  gripper_ctrl_code: 3
  gripper_command_deadband: 0.005
  gripper_min_command_interval_s: 0.03
  gripper_keepalive_s: 0.20
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_piper_direct_v16
  port: /dev/ttyUSB50
  frequency: 100
  use_gripper: true
  scale_xyz: 1.0
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  use_raw_translation_mapping: true

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: false
  rotation_scale: 1.0
  rotation_filter_alpha: 0.4

  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 3
  gripper_filter_alpha: 0.75
  gripper_deadband: 0.005
  gripper_max_step: 0.15

fps: 50

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_direct_v16
  repo_id: local/single_pika_piper_direct_v16
  single_task: Pika to Piper direct MOVE P V16
  fps: 50
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
