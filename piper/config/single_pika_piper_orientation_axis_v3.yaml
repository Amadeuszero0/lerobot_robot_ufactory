# Guarded orientation-axis V3 test. XYZ is restricted around the verified
# 2026-08-03 test pose; regenerate the bounds if the Piper is manually moved.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false
  max_cartesian_step_mm: 0.2
  max_rotation_step_rad: 0.005
  translation_deadband_mm: 0.2
  rotation_deadband_rad: 0.003
  workspace_x: [158.2, 160.2]
  workspace_y: [51.4, 53.4]
  workspace_z: [298.2, 300.2]
  move_mode: move_p
  move_speed_percent: 5
  min_command_interval_s: 0.10
  lock_orientation: false
  send_gripper: false
  gripper_effort: 1000
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_orientation_axis_v3
  port: /dev/ttyUSB50
  frequency: 20
  use_gripper: false
  scale_xyz: 0.5
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]
  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: true
  rotation_scale: 0.25

fps: 30

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_orientation_axis_v3
  repo_id: local/single_pika_piper_orientation_axis_v3
  single_task: guarded corrected Pika orientation-axis test
  fps: 30
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
