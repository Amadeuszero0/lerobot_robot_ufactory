# Gemini-derived experimental profile (safe interpretation, not a literal copy).
#
# Accepted ideas:
#   * keep the controller/update cadence internally consistent;
#   * reduce excessive gripper filtering and command latency;
#   * use a slightly larger MOVE P look-ahead and modestly higher speed.
#
# Rejected for this hardware:
#   * unsupported servo_cartesian mode;
#   * CPV and MOVE L streaming (previous physical tests were unsafe);
#   * 30-50% speed and 30-50 Hz command streaming;
#   * relaxing the verified workspace before the jump cause is known.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  # Moderate step/speed increase from the V5 baseline. MOVE P is retained.
  max_cartesian_step_mm: 5.0
  max_rotation_step_rad: 0.006
  translation_deadband_mm: 1.5
  rotation_deadband_rad: 0.003

  workspace_x: [110.0, 230.0]
  workspace_y: [-20.0, 110.0]
  workspace_z: [260.0, 360.0]

  move_mode: move_p
  move_speed_percent: 8
  min_command_interval_s: 0.0667
  lock_orientation: false

  send_gripper: true
  gripper_effort: 1000
  gripper_command_deadband: 0.01
  gripper_min_command_interval_s: 0.05
  gripper_keepalive_s: 0.30
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_gemini
  port: /dev/ttyUSB50
  frequency: 15
  use_gripper: true
  scale_xyz: 0.50
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: true
  rotation_scale: 0.40

  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 1
  gripper_filter_alpha: 0.70
  gripper_deadband: 0.005
  gripper_max_step: 0.20

# The control loop, Pika poll rate, and dataset sampling rate all use 15 Hz.
fps: 15

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_gemini
  repo_id: local/single_pika_piper_gemini
  single_task: Gemini-derived guarded MOVE P Pika teleoperation
  fps: 15
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
